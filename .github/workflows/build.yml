name: Mod Build

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/**
      - src/**
      - versions/**
      - ModWrapper/**
      - neoforge-sinytra/**
      - build.gradle
      - common.gradle
      - gradle.properties
      - settings.gradle

jobs:
  build:
    strategy:
      matrix:
        java: [ 25 ]
        distro: [ zulu ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    env:
      CI_BUILD: true
      PR_BUILD: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: ${{ matrix.distro }}
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean :ModWrapper:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: 'Artifacts'
          path: ./ModWrapper/build/libs/*.jar

      - name: Resolve Publisher Token
        if: ${{ startsWith(github.ref, 'refs/heads/releases/') }}
        id: resolve_token
        env:
          SECRETS_JSON: ${{ toJson(secrets) }}
          COMMITTER_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          echo "Committer email: $COMMITTER_EMAIL"
          PUBLISHER_NAME=""

          while IFS=' ' read -r email name; do
            email=$(echo "$email" | tr -d '\r')
            name=$(echo "$name" | tr -d '\r')
    
            if [ "$email" = "$COMMITTER_EMAIL" ]; then
              PUBLISHER_NAME="$name"
              break
            fi
          done < .github/.publisher

          if [ -n "$PUBLISHER_NAME" ]; then
            echo "Resolved publisher: $PUBLISHER_NAME"
            echo "modrinth_token_name=MODRINTH_TOKEN_${PUBLISHER_NAME}" >> "$GITHUB_OUTPUT"
            echo "curseforge_token_name=CURSEFORGE_TOKEN_${PUBLISHER_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "No publisher matched; using default tokens."
            echo "modrinth_token_name=MODRINTH_TOKEN" >> "$GITHUB_OUTPUT"
            echo "curseforge_token_name=CURSEFORGE_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: ${{ startsWith(github.ref, 'refs/heads/releases/') }}
        run: ./gradlew :ModWrapper:publishMods
        env:
          CURSEFORGE_TOKEN: ${{ secrets[steps.resolve_token.outputs.curseforge_token_name] || secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets[steps.resolve_token.outputs.modrinth_token_name] || secrets.MODRINTH_TOKEN }}
